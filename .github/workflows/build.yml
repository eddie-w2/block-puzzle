name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Load signing key from secrets
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "SIGNING_STORE_PASSWORD=${{ secrets.SIGNING_STORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS=${{ secrets.SIGNING_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_PASSWORD=${{ secrets.SIGNING_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      # Without the signing secrets the code is still compiled, but nothing is published.
      - name: Signing secrets missing
        if: env.KEYSTORE_B64 == ''
        run: |
          echo "::warning title=No signing key::Add the SIGNING_* repository secrets (see README) to publish installable APKs. Building a debug APK only."
          gradle assembleDebug --no-daemon --stacktrace

      - name: Build signed APK
        if: env.KEYSTORE_B64 != ''
        run: |
          gradle assembleRelease --no-daemon --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Sector8-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        if: env.KEYSTORE_B64 != ''
        with:
          name: Sector8-apk
          path: dist/*.apk

      # The app checks this release for updates, so it holds only the newest APK.
      - name: Clear older APKs from the Latest release
        if: env.KEYSTORE_B64 != '' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            for a in $(gh release view latest --json assets --jq '.assets[].name'); do
              gh release delete-asset latest "$a" -y
            done
          fi

      - name: Publish to the Latest release
        if: env.KEYSTORE_B64 != '' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build (1.0.${{ github.run_number }})
          prerelease: true
          make_latest: false
          files: dist/*.apk
          body: |
            Newest build from main. The app finds this update on its own (Settings → Check for updates), or download the .apk below and open it on your phone.

            Changes: ${{ github.event.head_commit.message }}

      - name: Publish tagged release
        if: env.KEYSTORE_B64 != '' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
