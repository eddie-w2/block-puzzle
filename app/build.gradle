plugins {
    id 'com.android.application'
}

// Signing comes from GitHub Actions secrets (see README). Without them only a debug build is made.
def envKeystore = System.getenv('SIGNING_KEYSTORE_PATH')

// Each CI build gets a higher versionCode so phones accept it as an update.
def buildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

android {
    namespace 'io.github.eddiew2.sector8'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.eddiew2.sector8'
        minSdk 24
        targetSdk 34
        versionCode buildNumber
        versionName "1.0.${buildNumber}"
    }

    signingConfigs {
        release {
            if (envKeystore) {
                storeFile file(envKeystore)
                storePassword System.getenv('SIGNING_STORE_PASSWORD')
                keyAlias System.getenv('SIGNING_KEY_ALIAS')
                keyPassword System.getenv('SIGNING_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (envKeystore) signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix '.debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.12.0'
}
